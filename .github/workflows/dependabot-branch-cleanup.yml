name: Clean up Dependabot branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    name: Delete closed PR branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')

    steps:
      - name: Delete Dependabot head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          response="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/git/refs/heads/${HEAD_REF}")"

          if [[ "$status" == "204" ]]; then
            echo "Deleted ${HEAD_REF}."
          elif [[ "$status" == "404" ]]; then
            echo "${HEAD_REF} was already deleted."
          else
            cat "$response"
            exit 1
          fi
