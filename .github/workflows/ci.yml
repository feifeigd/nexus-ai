name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Go API
        working-directory: services/api
        run: go test ./...

      - name: Vet Go API
        working-directory: services/api
        run: go vet ./...

      - name: Lint web
        run: pnpm lint:web

      - name: Test web
        run: pnpm test:web

      - name: Build web
        run: pnpm build:web

      - name: Generate admin types
        run: pnpm --filter admin exec max setup

      - name: Lint admin
        run: pnpm lint:admin

      - name: Check Ant Design usage
        run: pnpm --filter admin exec antd lint ./src

      - name: Test admin
        run: pnpm test:admin

      - name: Build admin
        run: pnpm build:admin
