Name: nexus-api
Host: 127.0.0.1
Port: 8080
Mode: dev
Timeout: 120000

Agent:
  Mode: mock
  OpenAI:
    BaseURL: https://api.deepseek.com/v1
    Model: deepseek-v4-flash
  Embedding:
    BaseURL: https://dashscope.aliyuncs.com/compatible-mode/v1/
    Model: text-embedding-v4

Auth:
  # JWT 签名密钥；生产环境用环境变量 NEXUS_AUTH_SECRET 覆盖。
  AccessSecret: "nexus-dev-secret-123"
  AccessExpire: 86400

SSH:
  # 远程命令执行：固定 root、端口 22、超时 30s。
  User: root
  Port: 22
  Timeout: 30
  # 命令白名单前缀（只读诊断，逐步开放）；可用 NEXUS_SSH_ALLOWED_COMMANDS 覆盖。
  AllowedCommands:
    - uptime
    - df
    - free
    - hostname
    - uname
    - "systemctl status"
    - "docker ps"
    - "kubectl get"
    - tail

Data:
  Database:
    Driver: sqlite3
    # mode=memory 不会创建文件，数据在内存，进程关闭，数据不保存，适用于开发中的测试
    Source: "file:nexus_ai?mode=memory&cache=shared&_fk=1&_txlock=immediate"
    MaxOpenConns: 20
    MaxIdleConns: 10
    ConnMaxLifetime: 0s
    Debug: false
    AutoMigrate: true
