Name: nexus-api
Host: 127.0.0.1
Port: 8080
Mode: dev
Timeout: 120000

Agent:
  Mode: mock

Data:
  Database:
    Driver: sqlite3
    Source: "file:nexus_ai?mode=memory&cache=shared&_fk=1&_txlock=immediate"
    MaxOpenConns: 20
    MaxIdleConns: 10
    ConnMaxLifetime: 0s
    Debug: false
    AutoMigrate: true
