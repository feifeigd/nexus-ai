name: Bug 报告
description: 报告 NexusAI 中可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明发生了什么，以及影响哪个应用或模块。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小、可操作的复现步骤。
      placeholder: |
        1. 启动……
        2. 打开……
        3. 执行……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请提供操作系统、浏览器、Node.js、Go 或 Docker 等相关版本。
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请移除密钥、令牌和个人信息后，再粘贴相关日志或截图。
      render: text
